<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوائي - المنصة الطبية</title>
    <!-- باقي المحتوى كما هو ولكن مع تحديث API_URL -->
    <script>
        // Detect environment automatically
        const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
        const API_URL = isProduction 
            ? 'https://YOUR-RAILWAY-APP-NAME.up.railway.app/api'  // استبدل باسم تطبيقك
            : 'http://localhost:5000/api';
        
        console.log(`📡 API URL: ${API_URL} (${isProduction ? 'Production' : 'Local'})`);
    </script>
    <!-- باقي الكود -->
</body>
</html>
