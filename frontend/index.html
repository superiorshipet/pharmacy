<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوائي - المنصة الطبية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: { 600: '#059669' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { transition: all 0.3s; }
        .toast { position: fixed; bottom: 20px; right: 20px; z-index: 1000; padding: 12px 20px; border-radius: 12px; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 1rem; padding: 1.5rem; max-width: 500px; width: 90%; }
        .dark .modal-content { background: #1f2937; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">

<div id="root"></div>

<script>
    // ========== CONFIG ==========
    // استخدم عنوان Railway مباشرة
    const API_URL = 'https://pharmacy-production-6a66.up.railway.app/api';
    
    console.log('📡 API URL:', API_URL);
    
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    let currentLang = localStorage.getItem('lang') || 'ar';
    let currentTheme = localStorage.getItem('theme') || 'light';
    let currentPage = localStorage.getItem('currentPage') || 'home';
    let allMeds = [];

    // ========== TRANSLATIONS ==========
    const trans = {
        ar: {
            appName: 'دوائي', home: 'الرئيسية', dashboard: 'لوحة التحكم', logout: 'خروج',
            login: 'دخول', register: 'حساب جديد', email: 'البريد', password: 'كلمة المرور',
            firstName: 'الاسم الأول', lastName: 'اسم العائلة', diseases: 'الأمراض المزمنة',
            loginTitle: 'تسجيل الدخول', registerTitle: 'إنشاء حساب', noAccount: 'ليس لديك حساب؟',
            heroTitle: 'دليلك الشامل للأدوية', heroDesc: 'ابحث عن أدويتك وتعرف على المواد الفعالة',
            searchPlaceholder: 'ابحث عن دواء...', medDirectory: 'دليل الأدوية', noResults: 'لا توجد نتائج',
            interactionWarning: '⚠️ تحذير:', welcome: 'أهلاً بك', patient: 'مريض',
            dailySchedule: 'جدول الأدوية', today: 'اليوم', taken: 'تم', notTaken: 'لم يتم',
            weeklyReport: 'التقرير الأسبوعي', adherence: 'نسبة الالتزام', medsTaken: 'تم تناول',
            from: 'من', addToSchedule: 'إضافة موعد', selectMedication: 'اختر الدواء',
            selectTime: 'اختر الوقت', add: 'إضافة', cancel: 'إلغاء',
            adminPanel: 'لوحة الأدمن', patients: 'المرضى', medications: 'الأدوية', actions: 'إجراءات',
            addMedication: 'إضافة دواء', nameAr: 'الاسم', activeIngredient: 'المادة الفعالة',
            description: 'الوصف', warnings: 'التحذيرات', dangerLevel: 'الخطورة', save: 'حفظ', delete: 'حذف',
            botTitle: 'المساعد الطبي', botPlaceholder: 'اكتب استفسارك الطبي...', botWelcome: 'مرحباً! أنا دواءي، مساعدك الطبي. كيف أساعدك؟'
        },
        en: {
            appName: 'Dawaee', home: 'Home', dashboard: 'Dashboard', logout: 'Logout',
            login: 'Login', register: 'Sign Up', email: 'Email', password: 'Password',
            firstName: 'First Name', lastName: 'Last Name', diseases: 'Chronic Diseases',
            loginTitle: 'Welcome Back', registerTitle: 'Create Account', noAccount: "Don't have an account?",
            heroTitle: 'Medication Guide', heroDesc: 'Search medications and learn about warnings',
            searchPlaceholder: 'Search medication...', medDirectory: 'Medications', noResults: 'No results',
            interactionWarning: '⚠️ Warning:', welcome: 'Welcome', patient: 'Patient',
            dailySchedule: 'Daily Schedule', today: 'Today', taken: 'Taken', notTaken: 'Not Taken',
            weeklyReport: 'Weekly Report', adherence: 'Adherence', medsTaken: 'Taken',
            from: 'of', addToSchedule: 'Add Schedule', selectMedication: 'Select Medication',
            selectTime: 'Select Time', add: 'Add', cancel: 'Cancel',
            adminPanel: 'Admin Panel', patients: 'Patients', medications: 'Medications', actions: 'Actions',
            addMedication: 'Add Medication', nameAr: 'Name', activeIngredient: 'Active Ingredient',
            description: 'Description', warnings: 'Warnings', dangerLevel: 'Danger Level', save: 'Save', delete: 'Delete',
            botTitle: 'Medical Assistant', botPlaceholder: 'Type your medical question...', botWelcome: 'Hello! I am Dawaee, your medical assistant. How can I help?'
        }
    };
    function t(key) { return trans[currentLang][key] || key; }

    // ========== HELPERS ==========
    function showToast(msg, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white`;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    async function api(endpoint, opts = {}) {
        const token = localStorage.getItem('token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`${API_URL}${endpoint}`, { ...opts, headers });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }

    function closeModal() { document.querySelector('.modal')?.remove(); }

    // ========== AUTH ==========
    window.handleLogin = async (e) => {
        e.preventDefault();
        try {
            const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pass').value }) });
            localStorage.setItem('token', res.token);
            localStorage.setItem('currentUser', JSON.stringify(res));
            currentUser = res;
            showToast('✅ تم الدخول');
            currentPage = 'home';
            render();
        } catch(e) { showToast('❌ خطأ', 'error'); }
    };

    window.handleRegister = async (e) => {
        e.preventDefault();
        try {
            const res = await api('/auth/register', { method: 'POST', body: JSON.stringify({ firstName: document.getElementById('fname').value, lastName: document.getElementById('lname').value, email: document.getElementById('remail').value, password: document.getElementById('rpass').value, chronicDiseases: document.getElementById('rdiseases').value }) });
            localStorage.setItem('token', res.token);
            localStorage.setItem('currentUser', JSON.stringify(res));
            currentUser = res;
            showToast('✅ تم التسجيل');
            currentPage = 'home';
            render();
        } catch(e) { showToast('❌ خطأ', 'error'); }
    };

    window.logout = () => { localStorage.clear(); currentUser = null; currentPage = 'home'; showToast('تم الخروج'); render(); };
    window.navigate = (page) => { currentPage = page; localStorage.setItem('currentPage', page); render(); };
    window.toggleTheme = () => { currentTheme = currentTheme === 'light' ? 'dark' : 'light'; localStorage.setItem('theme', currentTheme); document.documentElement.classList.toggle('dark'); render(); };
    window.toggleLang = () => { currentLang = currentLang === 'ar' ? 'en' : 'ar'; localStorage.setItem('lang', currentLang); render(); };

    // ========== NAVBAR ==========
    function Navbar() {
        const token = localStorage.getItem('token');
        return `<nav class="bg-white dark:bg-gray-800 shadow-lg sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b dark:border-gray-700">
            <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')"><i class="fa-solid fa-heartbeat text-emerald-600 text-2xl"></i><span class="text-xl font-bold text-gray-800 dark:text-white">${t('appName')}</span></div>
            <div class="flex gap-3 items-center">
                <button onclick="toggleTheme()" class="text-gray-700 dark:text-white"><i class="fa-solid ${currentTheme === 'light' ? 'fa-moon' : 'fa-sun'}"></i></button>
                <button onclick="toggleLang()" class="text-gray-700 dark:text-white"><i class="fa-solid fa-globe"></i> ${currentLang === 'ar' ? 'EN' : 'عربي'}</button>
                ${token && currentUser ? `
                    <button onclick="navigate('home')" class="text-gray-700 dark:text-white">${t('home')}</button>
                    <button onclick="navigate('dashboard')" class="text-gray-700 dark:text-white">${t('dashboard')}</button>
                    ${currentUser.role === 'Admin' ? `<button onclick="navigate('admin')" class="text-purple-600">${t('adminPanel')}</button>` : ''}
                    <button onclick="logout()" class="text-red-600">${t('logout')}</button>
                ` : `
                    <button onclick="navigate('login')" class="text-emerald-600">${t('login')}</button>
                    <button onclick="navigate('register')" class="bg-emerald-600 text-white px-3 py-1 rounded">${t('register')}</button>
                `}
            </div>
        </nav>`;
    }

    // ========== PAGES ==========
    async function HomePage() {
        try { allMeds = await api('/Medications'); } catch(e) { allMeds = []; }
        return `<div class="max-w-6xl mx-auto px-4 py-8">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-8 text-white mb-8 text-center">
                <h1 class="text-4xl font-bold mb-2">${t('heroTitle')}</h1>
                <p class="mb-4">${t('heroDesc')}</p>
                <div class="relative max-w-md mx-auto"><input type="text" id="searchHome" placeholder="${t('searchPlaceholder')}" class="w-full px-4 py-2 rounded-full text-black"><i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i></div>
            </div>
            <h2 class="text-xl font-bold mb-4 text-gray-800 dark:text-white">${t('medDirectory')}</h2>
            <div id="medGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>`;
    }

    function LoginPage() {
        return `<div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md">
                <div class="text-center"><i class="fa-solid fa-heartbeat text-emerald-600 text-5xl"></i><h2 class="text-2xl font-bold mt-2 text-gray-800 dark:text-white">${t('loginTitle')}</h2></div>
                <form onsubmit="handleLogin(event)"><input id="email" type="email" placeholder="${t('email')}" class="w-full p-2 border rounded mt-4 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required><input id="pass" type="password" placeholder="${t('password')}" class="w-full p-2 border rounded mt-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required><button type="submit" class="w-full bg-emerald-600 text-white p-2 rounded mt-4 font-bold">${t('login')}</button></form>
                <p class="text-center mt-4 text-gray-600 dark:text-gray-400">${t('noAccount')} <button onclick="navigate('register')" class="text-emerald-600">${t('register')}</button></p>
                <p class="text-center text-xs text-gray-400 mt-3">admin@dawaee.com / Admin123!</p>
            </div>
        </div>`;
    }

    function RegisterPage() {
        return `<div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md"><h2 class="text-2xl font-bold text-center text-gray-800 dark:text-white">${t('registerTitle')}</h2>
            <form onsubmit="handleRegister(event)"><input id="fname" placeholder="${t('firstName')}" class="w-full p-2 border rounded mt-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required><input id="lname" placeholder="${t('lastName')}" class="w-full p-2 border rounded mt-2 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required><input id="remail" type="email" placeholder="${t('email')}" class="w-full p-2 border rounded mt-2 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required><input id="rpass" type="password" placeholder="${t('password')}" class="w-full p-2 border rounded mt-2 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required><textarea id="rdiseases" placeholder="${t('diseases')}" class="w-full p-2 border rounded mt-2 dark:bg-gray-700 dark:border-gray-600 dark:text-white" rows="2"></textarea><button type="submit" class="w-full bg-emerald-600 text-white p-2 rounded mt-4 font-bold">${t('register')}</button></form></div>
        </div>`;
    }

    async function DashboardPage() {
        let schedules = [], report = {};
        try { schedules = await api('/dashboard/schedules'); } catch(e) { console.log('schedules error', e); }
        try { report = await api('/dashboard/weekly-report'); } catch(e) { console.log('report error', e); }
        
        const takenCount = schedules.filter(s => s.isTaken).length;
        const totalCount = schedules.length;
        const progress = totalCount > 0 ? (takenCount / totalCount) * 100 : 0;
        
        return `<div class="max-w-6xl mx-auto px-4 py-8">
            <h1 class="text-2xl font-bold mb-4 text-gray-800 dark:text-white">${t('welcome')}, ${currentUser?.firstName || ''} 👋</h1>
            <button onclick="showAddScheduleModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg mb-4 font-bold">+ ${t('addToSchedule')}</button>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="md:col-span-2 bg-white dark:bg-gray-800 rounded-xl p-4 shadow">
                    <div class="flex justify-between items-center mb-3"><h2 class="font-bold">${t('dailySchedule')}</h2><span class="text-sm text-gray-500">${totalCount} دواء</span></div>
                    <div id="schedulesList">
                        ${schedules.length === 0 ? '<p class="text-gray-500 text-center py-8">لا توجد مواعيد اليوم</p>' : schedules.map((s) => `<div class="flex justify-between items-center p-3 border-b dark:border-gray-700">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleTaken(${s.id}, ${s.isTaken})" class="w-8 h-8 rounded-full flex items-center justify-center transition ${s.isTaken ? 'bg-green-500 text-white' : 'border-2 border-gray-400'}">
                                    ${s.isTaken ? '✓' : ''}
                                </button>
                                <div><span class="font-bold ${s.isTaken ? 'line-through text-gray-500' : ''}">${s.medicationNameAr}</span><br><span class="text-sm text-gray-500">${new Date(s.scheduledTime).toLocaleTimeString()}</span></div>
                            </div>
                            <button onclick="deleteSchedule(${s.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>`).join('')}
                    </div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow">
                    <h2 class="font-bold mb-3">📊 ${t('weeklyReport')}</h2>
                    <div class="mb-4"><div class="flex justify-between mb-2"><span>${t('adherence')}</span><span class="text-emerald-600 font-bold">${Math.round(progress)}%</span></div><div class="w-full bg-gray-200 rounded-full h-3"><div class="bg-emerald-600 h-3 rounded-full" style="width:${progress}%"></div></div></div>
                    <div class="text-center p-4 bg-green-50 dark:bg-green-900/20 rounded-lg"><span class="text-3xl font-bold">${takenCount}/${totalCount}</span><br><span>💊 ${t('medsTaken')}</span></div>
                </div>
            </div>
        </div>`;
    }

    window.toggleTaken = async (id, current) => {
        try { await api('/dashboard/schedules/toggle', { method: 'PUT', body: JSON.stringify({ scheduleId: id, isTaken: !current }) }); render(); showToast(current ? 'تم إلغاء' : 'تم التسجيل'); } catch(e) { showToast('خطأ', 'error'); }
    };

    window.deleteSchedule = async (id) => {
        if(confirm('تأكيد الحذف؟')) { try { await api(`/dashboard/schedules/${id}`, { method: 'DELETE' }); render(); showToast('تم الحذف'); } catch(e) { showToast('خطأ', 'error'); } }
    };

    window.showAddScheduleModal = async () => {
        try { allMeds = await api('/Medications'); } catch(e) { showToast('خطأ في تحميل الأدوية', 'error'); return; }
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3 class="font-bold mb-3">➕ ${t('addToSchedule')}</h3>
            <select id="medId" class="w-full p-2 border rounded mb-3 dark:bg-gray-700">${allMeds.map(m => `<option value="${m.id}">💊 ${m.nameAr}</option>`).join('')}</select>
            <input type="time" id="medTime" class="w-full p-2 border rounded mb-3 dark:bg-gray-700" value="09:00">
            <div class="flex gap-2"><button onclick="saveSchedule()" class="flex-1 bg-emerald-600 text-white p-2 rounded font-bold">✅ ${t('add')}</button><button onclick="closeModal()" class="flex-1 bg-gray-500 text-white p-2 rounded">❌ ${t('cancel')}</button></div>
        </div>`;
        document.body.appendChild(modal);
    };

    window.saveSchedule = async () => {
        const medId = document.getElementById('medId').value;
        const time = document.getElementById('medTime').value;
        if (!medId || !time) { showToast('اختر الدواء والوقت', 'error'); return; }
        const [h, m] = time.split(':');
        const date = new Date(); date.setHours(parseInt(h), parseInt(m), 0, 0);
        try { await api('/dashboard/schedules', { method: 'POST', body: JSON.stringify({ medicationId: parseInt(medId), scheduledTime: date.toISOString() }) }); closeModal(); render(); showToast('✅ تم الإضافة'); } catch(e) { showToast('❌ خطأ', 'error'); }
    };

    async function AdminPage() {
        let patients = [], meds = [];
        try { patients = await api('/admin/patients'); } catch(e) {}
        try { meds = await api('/admin/medications'); } catch(e) {}
        return `<div class="max-w-6xl mx-auto px-4 py-8"><h1 class="text-2xl font-bold mb-4">👑 ${t('adminPanel')}</h1>
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 mb-6 shadow"><h2 class="font-bold mb-2">👥 ${t('patients')}</h2>${patients.map(p => `<div class="flex justify-between items-center p-2 border-b"><span>${p.name}</span><span>${p.email}</span><button onclick="deletePatient(${p.id})" class="text-red-500">🗑️</button></div>`).join('')}</div>
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow"><div class="flex justify-between"><h2 class="font-bold mb-2">💊 ${t('medications')}</h2><button onclick="showAddMedModal()" class="bg-emerald-600 text-white px-3 py-1 rounded">+ ${t('addMedication')}</button></div>${meds.map(m => `<div class="flex justify-between items-center p-2 border-b"><span>${m.nameAr}</span><button onclick="deleteMedication(${m.id})" class="text-red-500">🗑️</button></div>`).join('')}</div>
        </div>`;
    }

    window.deletePatient = async (id) => { if(confirm('تأكيد؟')){ await api(`/admin/patients/${id}`, { method: 'DELETE' }); render(); showToast('تم الحذف'); } };
    window.deleteMedication = async (id) => { if(confirm('تأكيد؟')){ await api(`/admin/medications/${id}`, { method: 'DELETE' }); render(); showToast('تم الحذف'); } };
    
    window.showAddMedModal = () => {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3 class="font-bold mb-3">➕ ${t('addMedication')}</h3>
            <input id="medNameAr" placeholder="${t('nameAr')}" class="w-full p-2 border rounded mb-2"><input id="medActive" placeholder="${t('activeIngredient')}" class="w-full p-2 border rounded mb-2"><textarea id="medDesc" placeholder="${t('description')}" class="w-full p-2 border rounded mb-2" rows="2"></textarea><textarea id="medWarn" placeholder="${t('warnings')}" class="w-full p-2 border rounded mb-2" rows="2"></textarea><select id="medDanger" class="w-full p-2 border rounded mb-3"><option value="low">🟢 منخفض</option><option value="medium">🟠 متوسط</option><option value="high">🔴 عالي</option></select>
            <button onclick="saveMedication()" class="w-full bg-emerald-600 text-white p-2 rounded font-bold">✅ ${t('save')}</button></div>`;
        document.body.appendChild(modal);
    };
    
    window.saveMedication = async () => {
        await api('/admin/medications', { method: 'POST', body: JSON.stringify({ nameAr: document.getElementById('medNameAr').value, nameEn: document.getElementById('medNameAr').value, activeIngredientAr: document.getElementById('medActive').value, activeIngredientEn: document.getElementById('medActive').value, descriptionAr: document.getElementById('medDesc').value, descriptionEn: document.getElementById('medDesc').value, warningsAr: document.getElementById('medWarn').value, warningsEn: document.getElementById('medWarn').value, dangerLevel: document.getElementById('medDanger').value }) });
        closeModal(); render(); showToast('✅ تم الإضافة');
    };

    // ========== SEARCH ==========
    async function updateSearch() {
        const search = document.getElementById('searchHome')?.value || '';
        const meds = search ? allMeds.filter(m => m.nameAr.includes(search) || m.activeIngredientAr.includes(search)) : allMeds;
        const grid = document.getElementById('medGrid');
        if (grid) grid.innerHTML = meds.map(m => `<div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow"><h3 class="font-bold text-emerald-700">💊 ${m.nameAr}</h3><p class="text-sm text-gray-600">🔬 ${m.activeIngredientAr}</p><p class="text-sm mt-2">${(m.descriptionAr || '').substring(0, 80)}</p><div class="mt-2 p-2 rounded ${m.dangerLevel === 'high' ? 'bg-red-100' : m.dangerLevel === 'medium' ? 'bg-orange-100' : 'bg-green-100'}"><span class="text-xs font-bold">⚠️ ${t('interactionWarning')}</span><p class="text-xs">${(m.warningsAr || '').substring(0, 60)}</p></div></div>`).join('');
    }

    // ========== CHATBOT ==========
    let chatOpen = false;
    let chatMessages = [];

    window.toggleChat = () => {
        chatOpen = !chatOpen;
        const win = document.getElementById('chatbotWindow');
        if (win) chatOpen ? win.classList.remove('hidden-chat') : win.classList.add('hidden-chat');
    };

    window.sendChatMessage = async () => {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        addChatMessage(msg, 'user');
        input.value = '';
        
        const token = localStorage.getItem('token');
        if (!token) { addChatMessage('يرجى تسجيل الدخول أولاً', 'bot'); return; }
        
        try {
            const res = await fetch(`${API_URL}/chatbot/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ messages: [{ role: 'user', message: msg }] })
            });
            const data = await res.json();
            addChatMessage(data.reply || 'عذراً، لم أستطع الرد', 'bot');
        } catch(e) { addChatMessage('عذراً، حدث خطأ', 'bot'); }
    };

    function addChatMessage(text, sender) {
        chatMessages.push({ text, sender });
        renderChatMessages();
    }

    function renderChatMessages() {
        const container = document.getElementById('chatMessagesContainer');
        if (!container) return;
        container.innerHTML = chatMessages.map(msg => `<div class="${msg.sender === 'user' ? 'message-user' : 'message-bot'}">${msg.text}</div>`).join('');
        container.scrollTop = container.scrollHeight;
    }

    function ChatbotComponent() {
        return `
            <div id="chatbotContainer">
                <button onclick="toggleChat()" class="fixed bottom-6 right-6 w-14 h-14 bg-emerald-600 text-white rounded-full shadow-lg flex items-center justify-center z-50"><i class="fa-solid fa-comment-medical text-2xl"></i></button>
                <div id="chatbotWindow" class="fixed bottom-24 right-6 w-96 h-[500px] bg-white dark:bg-gray-800 rounded-2xl shadow-2xl hidden flex flex-col z-50 border">
                    <div class="bg-emerald-600 text-white p-3 rounded-t-2xl flex justify-between"><span><i class="fa-solid fa-robot mr-2"></i> ${t('botTitle')}</span><button onclick="toggleChat()"><i class="fa-solid fa-times"></i></button></div>
                    <div id="chatMessagesContainer" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
                    <div class="p-3 border-t flex gap-2"><input id="chatInput" placeholder="${t('botPlaceholder')}" class="flex-1 p-2 border rounded-full dark:bg-gray-700"><button onclick="sendChatMessage()" class="bg-emerald-600 text-white w-10 h-10 rounded-full"><i class="fa-solid fa-paper-plane"></i></button></div>
                </div>
            </div>
        `;
    }

    function initChat() { chatMessages = [{ text: t('botWelcome'), sender: 'bot' }]; renderChatMessages(); }

    // ========== MAIN RENDER ==========
    async function render() {
        const token = localStorage.getItem('token');
        let content = '';
        if (!token && (currentPage === 'dashboard' || currentPage === 'admin')) content = LoginPage();
        else if (currentPage === 'login') content = LoginPage();
        else if (currentPage === 'register') content = RegisterPage();
        else if (currentPage === 'dashboard') content = await DashboardPage();
        else if (currentPage === 'admin' && currentUser?.role === 'Admin') content = await AdminPage();
        else content = await HomePage();
        document.getElementById('root').innerHTML = Navbar() + `<main>${content}</main>` + ChatbotComponent();
        if (currentPage === 'home') { await updateSearch(); document.getElementById('searchHome')?.addEventListener('input', updateSearch); }
        initChat();
    }

    if (currentTheme === 'dark') document.documentElement.classList.add('dark');
    render();
</script>
</body>
</html>
