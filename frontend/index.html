<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوائي - المنصة الطبية الشاملة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; transition: all 0.3s; }
        .loading { display: none; }
        .loading.active { display: inline-block; }
        .toast { position: fixed; bottom: 20px; right: 20px; z-index: 1000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-right">
    
    <div id="root"></div>

    <script>
        // API Configuration
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'https://localhost:5001/api' 
            : 'https://your-railway-app.up.railway.app/api';
        
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        
        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white px-6 py-3 rounded-lg shadow-lg`;
            toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} mr-2"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // API calls
        const api = {
            async request(endpoint, options = {}) {
                const token = localStorage.getItem('token');
                const headers = {
                    'Content-Type': 'application/json',
                    ...(token && { 'Authorization': `Bearer ${token}` }),
                    ...options.headers
                };
                
                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, { ...options, headers });
                    if (!response.ok) throw new Error(await response.text());
                    return await response.json();
                } catch (error) {
                    console.error('API Error:', error);
                    throw error;
                }
            },
            
            auth: {
                login: (data) => api.request('/Auth/login', { method: 'POST', body: JSON.stringify(data) }),
                register: (data) => api.request('/Auth/register', { method: 'POST', body: JSON.stringify(data) })
            },
            
            medications: {
                getAll: (search = '') => api.request(`/Medications${search ? `?search=${search}` : ''}`),
                getById: (id) => api.request(`/Medications/${id}`)
            },
            
            dashboard: {
                getSchedules: () => api.request('/Dashboard/schedules'),
                addSchedule: (data) => api.request('/Dashboard/schedules', { method: 'POST', body: JSON.stringify(data) }),
                toggleTaken: (data) => api.request('/Dashboard/schedules/toggle', { method: 'PUT', body: JSON.stringify(data) }),
                getWeeklyReport: () => api.request('/Dashboard/weekly-report')
            },
            
            chatbot: {
                send: (message) => api.request('/Chatbot/chat', { method: 'POST', body: JSON.stringify({ message }) }),
                getHistory: () => api.request('/Chatbot/history')
            },
            
            admin: {
                getPatients: () => api.request('/Admin/patients'),
                getPatientDetails: (id) => api.request(`/Admin/patients/${id}`)
            }
        };
        
        // Translations
        const translations = {
            ar: {
                appName: 'دوائي', home: 'الرئيسية', dashboard: 'لوحة التحكم', logout: 'خروج',
                login: 'دخول', register: 'حساب جديد', adminPanel: 'لوحة الأدمن',
                loginTitle: 'تسجيل الدخول', loginDesc: 'مرحباً بك مجدداً في منصة دوائي',
                email: 'البريد الإلكتروني', password: 'كلمة المرور', noAccount: 'ليس لديك حساب؟', registerNow: 'سجل الآن',
                firstName: 'الاسم الأول', lastName: 'اسم العائلة', diseases: 'الأمراض المزمنة (إن وجدت)',
                registerTitle: 'إنشاء حساب مريض جديد', registerBtn: 'تسجيل البيانات',
                heroTitle: 'دليلك الشامل للأدوية', heroDesc: 'ابحث عن أدويتك، تعرف على المواد الفعالة، واكتشف التحذيرات الهامة.',
                searchPlaceholder: 'ابحث باسم الدواء...', medDirectory: 'دليل الأدوية', noResults: 'لا توجد نتائج.',
                interactionWarning: '⚠️ تحذير:', welcome: 'أهلاً بك', patient: 'مريض',
                dailySchedule: 'جدول الأدوية', today: 'اليوم', taken: 'تم التناول',
                weeklyReport: 'التقرير الأسبوعي', adherence: 'نسبة الالتزام',
                todayStats: 'إحصائيات اليوم', medsTaken: 'تم تناول:', from: 'من',
                botTitle: 'المساعد الطبي', botPlaceholder: 'اكتب استفسارك...',
                addSchedule: 'إضافة موعد', selectMed: 'اختر الدواء', time: 'الوقت', save: 'حفظ'
            },
            en: {
                appName: 'Dawaee', home: 'Home', dashboard: 'Dashboard', logout: 'Logout',
                login: 'Login', register: 'Sign Up', adminPanel: 'Admin Panel',
                loginTitle: 'Welcome Back', loginDesc: 'Sign in to your Dawaee account',
                email: 'Email', password: 'Password', noAccount: "Don't have an account?", registerNow: 'Sign up',
                firstName: 'First Name', lastName: 'Last Name', diseases: 'Chronic Diseases',
                registerTitle: 'Create Account', registerBtn: 'Register',
                heroTitle: 'Your Medication Guide', heroDesc: 'Search medications, learn about ingredients, and discover warnings.',
                searchPlaceholder: 'Search medication...', medDirectory: 'Medications', noResults: 'No results found.',
                interactionWarning: '⚠️ Warning:', welcome: 'Welcome', patient: 'Patient',
                dailySchedule: 'Daily Schedule', today: 'Today', taken: 'Taken',
                weeklyReport: 'Weekly Report', adherence: 'Adherence',
                todayStats: "Today's Stats", medsTaken: 'Taken:', from: 'of',
                botTitle: 'Medical Assistant', botPlaceholder: 'Ask anything...',
                addSchedule: 'Add Schedule', selectMed: 'Select medication', time: 'Time', save: 'Save'
            }
        };
        
        let currentLang = localStorage.getItem('lang') || 'ar';
        let currentTheme = localStorage.getItem('theme') || 'light';
        
        function t(key) { return translations[currentLang][key] || key; }
        
        // Apply theme
        if (currentTheme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        
        // Render App
        function render() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            
            let content = '';
            
            // Navbar
            content += `
                <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between h-16 items-center">
                            <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
                                <i class="fa-solid fa-heartbeat text-teal-600 dark:text-teal-400 text-3xl"></i>
                                <span class="text-xl font-bold text-gray-800 dark:text-white">${t('appName')}</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <button onclick="toggleTheme()" class="text-gray-500 hover:text-teal-600">
                                    <i class="fa-solid ${currentTheme === 'light' ? 'fa-moon' : 'fa-sun'} text-xl"></i>
                                </button>
                                <button onclick="toggleLang()" class="font-bold text-gray-500 hover:text-teal-600">
                                    <i class="fa-solid fa-globe"></i> ${currentLang === 'ar' ? 'EN' : 'عربي'}
                                </button>
                                ${token && user ? `
                                    <button onclick="navigateTo('home')" class="text-gray-600 dark:text-gray-300 hover:text-teal-600">${t('home')}</button>
                                    <button onclick="navigateTo('dashboard')" class="text-gray-600 dark:text-gray-300 hover:text-teal-600">${t('dashboard')}</button>
                                    ${user.role === 'Admin' ? `<button onclick="navigateTo('admin')" class="text-red-600 dark:text-red-400 hover:text-red-700">${t('adminPanel')}</button>` : ''}
                                    <button onclick="logout()" class="text-red-500 hover:text-red-400">${t('logout')}</button>
                                ` : `
                                    <button onclick="navigateTo('login')" class="text-teal-600 font-medium">${t('login')}</button>
                                    <button onclick="navigateTo('register')" class="bg-teal-600 text-white px-4 py-2 rounded-lg">${t('register')}</button>
                                `}
                            </div>
                        </div>
                    </div>
                </nav>
            `;
            
            // Main content based on current page
            const page = window.currentPage || 'home';
            content += '<main class="pb-24">';
            
            if (!token && (page === 'dashboard' || page === 'admin')) {
                content += renderLogin();
                window.currentPage = 'login';
            } else if (page === 'login') content += renderLogin();
            else if (page === 'register') content += renderRegister();
            else if (page === 'dashboard') content += renderDashboard();
            else if (page === 'admin' && user?.role === 'Admin') content += renderAdmin();
            else content += renderHome();
            
            content += '</main>';
            content += renderChatbot();
            
            document.getElementById('root').innerHTML = content;
        }
        
        function renderHome() {
            return `
                <div class="max-w-7xl mx-auto px-4 py-8">
                    <div class="bg-teal-700 dark:bg-teal-900 rounded-3xl p-8 md:p-12 text-white mb-12">
                        <h1 class="text-3xl md:text-5xl font-bold mb-4">${t('heroTitle')}</h1>
                        <p class="text-teal-100 text-lg mb-8">${t('heroDesc')}</p>
                        <div class="relative max-w-xl">
                            <input type="text" id="searchInput" placeholder="${t('searchPlaceholder')}" 
                                class="w-full px-6 py-4 rounded-full text-gray-800 dark:text-white dark:bg-gray-800">
                            <i class="fa-solid fa-search absolute left-5 top-5 text-gray-400"></i>
                        </div>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">${t('medDirectory')}</h2>
                    <div id="medicationsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="text-center py-12">Loading...</div>
                    </div>
                </div>
            `;
        }
        
        function renderLogin() {
            return `
                <div class="min-h-[80vh] flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-md">
                        <div class="text-center mb-6">
                            <i class="fa-solid fa-heartbeat text-teal-600 text-5xl mb-4"></i>
                            <h2 class="text-2xl font-bold">${t('loginTitle')}</h2>
                            <p class="text-gray-500">${t('loginDesc')}</p>
                        </div>
                        <form onsubmit="handleLogin(event)">
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1">${t('email')}</label>
                                <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700">
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm font-medium mb-1">${t('password')}</label>
                                <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700">
                            </div>
                            <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-lg font-bold">${t('login')}</button>
                        </form>
                        <div class="mt-6 text-center">
                            ${t('noAccount')} <button onclick="navigateTo('register')" class="text-teal-600 font-bold">${t('registerNow')}</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderRegister() {
            return `
                <div class="min-h-[80vh] flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-lg">
                        <h2 class="text-2xl font-bold text-center mb-6">${t('registerTitle')}</h2>
                        <form onsubmit="handleRegister(event)">
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div><label>${t('firstName')}</label><input type="text" id="regFirstName" required class="w-full px-4 py-2 border rounded-lg"></div>
                                <div><label>${t('lastName')}</label><input type="text" id="regLastName" required class="w-full px-4 py-2 border rounded-lg"></div>
                            </div>
                            <div class="mb-4"><label>${t('email')}</label><input type="email" id="regEmail" required class="w-full px-4 py-2 border rounded-lg"></div>
                            <div class="mb-4"><label>${t('password')}</label><input type="password" id="regPassword" required class="w-full px-4 py-2 border rounded-lg"></div>
                            <div class="mb-6"><label>${t('diseases')}</label><textarea id="regDiseases" rows="2" class="w-full px-4 py-2 border rounded-lg"></textarea></div>
                            <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-lg font-bold">${t('registerBtn')}</button>
                        </form>
                    </div>
                </div>
            `;
        }
        
        function renderDashboard() {
            return `
                <div class="max-w-7xl mx-auto px-4 py-8">
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold">${t('welcome')}, ${currentUser?.firstName} 👋</h1>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2">
                            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6">
                                <h2 class="text-xl font-bold mb-4">${t('dailySchedule')}</h2>
                                <div id="schedulesList" class="space-y-3">Loading...</div>
                                <button onclick="showAddScheduleModal()" class="mt-4 bg-teal-600 text-white px-4 py-2 rounded-lg">+ ${t('addSchedule')}</button>
                            </div>
                        </div>
                        <div>
                            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6">
                                <h2 class="text-xl font-bold mb-4">${t('weeklyReport')}</h2>
                                <div id="weeklyReport">Loading...</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderAdmin() {
            return `
                <div class="max-w-7xl mx-auto px-4 py-8">
                    <h1 class="text-3xl font-bold mb-6">${t('adminPanel')}</h1>
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6">
                        <h2 class="text-xl font-bold mb-4">المرضى</h2>
                        <div id="patientsList" class="space-y-3">Loading...</div>
                    </div>
                </div>
            `;
        }
        
        function renderChatbot() {
            return `
                <div id="chatbotContainer">
                    <button onclick="toggleChatbot()" class="fixed bottom-6 right-6 h-16 w-16 bg-teal-600 text-white rounded-full shadow-2xl hover:bg-teal-700 z-50">
                        <i class="fa-solid fa-comment-medical text-3xl"></i>
                    </button>
                    <div id="chatbotWindow" class="fixed bottom-6 right-6 w-96 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl hidden z-50 flex flex-col" style="height: 500px;">
                        <div class="bg-teal-600 text-white p-4 rounded-t-2xl flex justify-between">
                            <span class="font-bold">${t('botTitle')}</span>
                            <button onclick="toggleChatbot()"><i class="fa-solid fa-times"></i></button>
                        </div>
                        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
                        <form onsubmit="sendChatMessage(event)" class="p-3 border-t dark:border-gray-700 flex gap-2">
                            <input type="text" id="chatInput" placeholder="${t('botPlaceholder')}" class="flex-1 px-4 py-2 border rounded-full dark:bg-gray-700">
                            <button type="submit" class="h-10 w-10 bg-teal-600 text-white rounded-full"><i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            `;
        }
        
        // Event Handlers
        window.handleLogin = async (e) => {
            e.preventDefault();
            try {
                const result = await api.auth.login({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                });
                localStorage.setItem('token', result.token);
                localStorage.setItem('currentUser', JSON.stringify(result));
                currentUser = result;
                showToast('تم تسجيل الدخول بنجاح!');
                navigateTo('dashboard');
            } catch (error) {
                showToast('خطأ في البريد الإلكتروني أو كلمة المرور', 'error');
            }
        };
        
        window.handleRegister = async (e) => {
            e.preventDefault();
            try {
                const result = await api.auth.register({
                    firstName: document.getElementById('regFirstName').value,
                    lastName: document.getElementById('regLastName').value,
                    email: document.getElementById('regEmail').value,
                    password: document.getElementById('regPassword').value,
                    chronicDiseases: document.getElementById('regDiseases').value
                });
                localStorage.setItem('token', result.token);
                localStorage.setItem('currentUser', JSON.stringify(result));
                showToast('تم إنشاء الحساب بنجاح!');
                navigateTo('dashboard');
            } catch (error) {
                showToast('حدث خطأ، يرجى المحاولة مرة أخرى', 'error');
            }
        };
        
        window.logout = () => {
            localStorage.removeItem('token');
            localStorage.removeItem('currentUser');
            currentUser = null;
            showToast('تم تسجيل الخروج');
            navigateTo('home');
        };
        
        window.navigateTo = (page) => {
            window.currentPage = page;
            render();
            if (page === 'home') loadMedications();
            if (page === 'dashboard') loadDashboard();
            if (page === 'admin') loadAdminPanel();
        };
        
        window.toggleTheme = () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);
            if (currentTheme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            render();
        };
        
        window.toggleLang = () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('lang', currentLang);
            render();
        };
        
        window.toggleChatbot = () => {
            const window = document.getElementById('chatbotWindow');
            window.classList.toggle('hidden');
            if (!window.classList.contains('hidden')) loadChatHistory();
        };
        
        window.sendChatMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            input.value = '';
            addChatMessage(message, 'user');
            
            try {
                const result = await api.chatbot.send(message);
                addChatMessage(result.response, 'bot');
            } catch (error) {
                addChatMessage('عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.', 'bot');
            }
        };
        
        function addChatMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[80%] p-3 rounded-2xl ${sender === 'user' ? 'bg-teal-600 text-white' : 'bg-gray-200 dark:bg-gray-700'}">${text}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        async function loadMedications() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', async (e) => {
                    const meds = await api.medications.getAll(e.target.value);
                    displayMedications(meds);
                });
            }
            const meds = await api.medications.getAll();
            displayMedications(meds);
        }
        
        function displayMedications(meds) {
            const container = document.getElementById('medicationsList');
            if (!container) return;
            
            if (meds.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12">${t('noResults')}</div>`;
                return;
            }
            
            container.innerHTML = meds.map(med => `
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm">
                    <h3 class="text-xl font-bold text-teal-700 dark:text-teal-400">${currentLang === 'ar' ? med.nameAr : med.nameEn}</h3>
                    <p class="text-sm text-gray-500 mb-3"><i class="fa-solid fa-flask"></i> ${currentLang === 'ar' ? med.activeIngredientAr : med.activeIngredientEn}</p>
                    <p class="text-gray-700 dark:text-gray-300 mb-4 text-sm">${currentLang === 'ar' ? med.descriptionAr : med.descriptionEn}</p>
                    <div class="p-3 rounded-xl ${med.dangerLevel === 'high' ? 'bg-red-50 dark:bg-red-900/20' : med.dangerLevel === 'medium' ? 'bg-orange-50 dark:bg-orange-900/20' : 'bg-blue-50 dark:bg-blue-900/20'}">
                        <strong class="text-sm">${t('interactionWarning')}</strong>
                        <p class="text-xs mt-1">${currentLang === 'ar' ? med.warningsAr : med.warningsEn}</p>
                    </div>
                </div>
            `).join('');
        }
        
        async function loadDashboard() {
            await loadSchedules();
            await loadWeeklyReport();
        }
        
        async function loadSchedules() {
            try {
                const schedules = await api.dashboard.getSchedules();
                const container = document.getElementById('schedulesList');
                if (!container) return;
                
                if (schedules.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-gray-500">لا توجد مواعيد مسجلة اليوم</div>';
                    return;
                }
                
                container.innerHTML = schedules.map(s => `
                    <div class="flex items-center justify-between p-4 border rounded-xl">
                        <div class="flex items-center gap-3">
                            <button onclick="toggleSchedule(${s.id}, ${!s.isTaken})" class="h-8 w-8 rounded-full flex items-center justify-center ${s.isTaken ? 'bg-teal-500 text-white' : 'border-2 border-gray-300'}">
                                ${s.isTaken ? '<i class="fa-solid fa-check"></i>' : ''}
                            </button>
                            <div>
                                <h3 class="font-bold ${s.isTaken ? 'line-through text-gray-500' : ''}">${currentLang === 'ar' ? s.medicationNameAr : s.medicationNameEn}</h3>
                                <p class="text-sm text-gray-500">${new Date(s.scheduledTime).toLocaleTimeString()}</p>
                            </div>
                        </div>
                        ${s.isTaken ? '<span class="text-xs bg-teal-100 text-teal-700 px-2 py-1 rounded">✓ تم</span>' : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading schedules:', error);
            }
        }
        
        window.toggleSchedule = async (id, isTaken) => {
            try {
                await api.dashboard.toggleTaken({ scheduleId: id, isTaken });
                await loadSchedules();
                await loadWeeklyReport();
            } catch (error) {
                showToast('حدث خطأ', 'error');
            }
        };
        
        async function loadWeeklyReport() {
            try {
                const report = await api.dashboard.getWeeklyReport();
                const container = document.getElementById('weeklyReport');
                if (!container) return;
                
                container.innerHTML = `
                    <div class="mb-4">
                        <div class="flex justify-between text-sm mb-2">
                            <span>${t('adherence')}</span>
                            <span class="font-bold text-teal-600">${report.adherencePercentage}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-teal-500 h-2 rounded-full" style="width: ${report.adherencePercentage}%"></div>
                        </div>
                    </div>
                    <div class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-4">
                        <h3 class="font-bold mb-2">${t('todayStats')}</h3>
                        <div class="flex justify-between">
                            <span>${t('medsTaken')}</span>
                            <span class="font-bold">${report.takenMeds} ${t('from')} ${report.totalMeds}</span>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading report:', error);
            }
        }
        
        async function loadAdminPanel() {
            try {
                const patients = await api.admin.getPatients();
                const container = document.getElementById('patientsList');
                if (!container) return;
                
                container.innerHTML = patients.map(p => `
                    <div class="flex justify-between items-center p-4 border rounded-xl">
                        <div>
                            <h3 class="font-bold">${p.name}</h3>
                            <p class="text-sm text-gray-500">${p.email}</p>
                            ${p.chronicDiseases ? `<p class="text-xs text-gray-400 mt-1">الأمراض المزمنة: ${p.chronicDiseases}</p>` : ''}
                        </div>
                        <div class="text-right">
                            <p class="text-sm">الالتزام: ${p.adherenceRate}%</p>
                            <p class="text-xs text-gray-500">${p.totalSchedules} موعد</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading patients:', error);
            }
        }
        
        async function loadChatHistory() {
            try {
                const history = await api.chatbot.getHistory();
                const container = document.getElementById('chatMessages');
                if (container && history.length > 0) {
                    container.innerHTML = '';
                    history.reverse().forEach(msg => {
                        addChatMessage(msg.message, 'user');
                        addChatMessage(msg.response, 'bot');
                    });
                }
            } catch (error) {
                console.error('Error loading chat history:', error);
            }
        }
        
        window.showAddScheduleModal = () => {
            const meds = prompt('أدخل اسم الدواء ووقته (مثال: بانادول, 08:00)');
            if (meds) {
                showToast('هذه ميزة تجريبية', 'error');
            }
        };
        
        // Initialize
        render();
        if (window.currentPage === 'home') loadMedications();
        if (window.currentPage === 'dashboard') loadDashboard();
    </script>
</body>
</html>
